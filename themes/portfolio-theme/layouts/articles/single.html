{{ define "main" }}
  <article class="page">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Date }}<p class="article-date">{{ .Format "January 2, 2006" }}</p>{{ end }}
    </header>

    <div class="page-content">
      {{ .Content }}
    </div>

    <p class="page-back"><a href="{{ "/articles/" | relURL }}">&larr; All articles</a></p>
  </article>
{{ end }}
